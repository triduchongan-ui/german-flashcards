<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki German Cloud Sync</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #d97706;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    button.tab-btn {
      flex: 1; padding: 12px; border: 1px solid var(--border);
      background: #e2e8f0; cursor: pointer; border-radius: 8px; font-weight: bold;
      font-size: 15px;
    }
    button.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .view { display: none; }
    .view.active { display: block; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], textarea {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 6px; box-sizing: border-box; font-size: 14px;
    }
    .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary);
      color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;
    }
    .btn-cancel {
      width: 100%; padding: 8px; background: #94a3b8;
      color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 8px;
    }

    .flashcard {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 28px 20px; text-align: center;
      min-height: 190px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px; position: relative;
    }
    .card-badge {
      position: absolute; top: 12px; right: 14px;
      font-size: 12px; background: #f1f5f9; color: #475569;
      padding: 3px 8px; border-radius: 12px; font-weight: 600;
    }
    .prompt-vi {
      font-size: 20px; font-weight: bold; color: #0f172a; margin-bottom: 16px;
    }
    .answer-input {
      width: 100%; max-width: 420px; padding: 12px; font-size: 17px;
      text-align: center; border: 2px solid #cbd5e1; border-radius: 8px;
      margin-bottom: 10px; outline: none; transition: border-color 0.2s;
    }
    .answer-input:focus { border-color: var(--primary); }

    .check-result {
      width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 14px;
      font-weight: 600; font-size: 15px; box-sizing: border-box;
    }
    .check-correct {
      background: #dcfce7; color: #166534; border: 1px solid #86efac;
    }
    .check-wrong {
      background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;
    }

    .german-text { font-size: 24px; font-weight: bold; margin-bottom: 8px; color: #1e293b; }
    .example-text { font-style: italic; color: #64748b; margin-top: 6px; }
    
    .audio-btn {
      background: #f1f5f9; border: 1px solid var(--border);
      border-radius: 50%; width: 44px; height: 44px; cursor: pointer; margin-bottom: 10px; font-size: 20px;
    }

    .rating-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rate-btn { padding: 10px 5px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    .rate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .again { background: #ef4444; }
    .hard { background: #f97316; }
    .good { background: #3b82f6; }
    .easy { background: #22c55e; }

    .stat-box {
      text-align: center; padding: 10px; background: #e0f2fe;
      border-radius: 6px; margin-bottom: 15px; font-weight: bold; color: #0369a1;
    }
    .sync-status {
      font-size: 13px; text-align: center; margin-bottom: 12px; font-weight: 600; color: #475569;
    }

    .word-list-section {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 2px solid var(--primary);
    }
    .word-list-title {
      font-size: 18px; font-weight: bold; margin-bottom: 12px; color: var(--primary);
    }

    .bulk-toolbar {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .select-all-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #1e3a8a;
      cursor: pointer;
      margin: 0;
    }
    .card-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0;
    }
    .bulk-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-bulk {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-bulk:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-bulk-upgrade { background: #0f766e; }
    .btn-bulk-delete { background: var(--danger); }

    .word-item {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .word-item.selected {
      background: #eff6ff;
      border-color: var(--primary);
    }
    .word-info { flex: 1; padding-right: 6px; }
    .word-de { font-weight: bold; color: var(--text); font-size: 16px; }
    .word-vi { color: #16a34a; font-size: 14px; font-weight: 500; }
    .word-ex { font-style: italic; color: #64748b; font-size: 12px; }
    .word-meta { font-size: 11px; color: #2563eb; margin-top: 4px; font-weight: 600; }
    .word-actions { display: flex; gap: 6px; }
    .btn-action {
      padding: 6px 12px; border: none; border-radius: 6px;
      color: white; font-size: 13px; cursor: pointer; font-weight: bold;
    }
    .btn-edit { background: var(--warning); }
    .btn-delete { background: var(--danger); }
  </style>

  <!-- Firebase App & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('study')">Ôn tập</button>
    <button class="tab-btn" onclick="switchTab('add')">Thêm / Quản lý từ</button>
  </div>

  <div class="sync-status" id="syncStatus">🔄 Đang kết nối Cloud...</div>

  <div id="studyView" class="view active">
    <div id="statBox" class="stat-box">Đang tải dữ liệu...</div>
    <div id="cardContainer"></div>
  </div>

  <div id="addView" class="view">
    <form id="addCardForm">
      <h3 id="formTitle" style="margin-top:0;">Thêm từ vựng mới</h3>
      <input type="hidden" id="editCardId" value="">
      
      <div class="form-group">
        <label for="german">Từ vựng / Cụm từ tiếng Đức:</label>
        <input type="text" id="german" placeholder="vd: die Sprachprüfung" required>
      </div>
      <div class="form-group">
        <label for="vietnamese">Nghĩa tiếng Việt:</label>
        <input type="text" id="vietnamese" placeholder="vd: kỳ thi năng lực ngôn ngữ" required>
      </div>
      <div class="form-group">
        <label for="example">Ví dụ (nếu có):</label>
        <textarea id="example" rows="2" placeholder="vd: Ich bereite mich auf die Sprachprüfung vor."></textarea>
      </div>

      <div id="progressEditBox" class="form-row" style="display:none; background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px;">
        <div>
          <label for="editReps" style="font-size:12px;">Số lần đã thuộc (reps):</label>
          <input type="number" id="editReps" min="0" value="0">
        </div>
        <div>
          <label for="editInterval" style="font-size:12px;">Mốc ngày hiện tại:</label>
          <input type="number" id="editInterval" min="0" value="0">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Lưu vào bộ thẻ (Tự đồng bộ)</button>
      <button type="button" id="cancelEditBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Hủy sửa</button>
    </form>

    <div class="word-list-section">
      <div class="word-list-title">📋 Danh sách từ đã lưu (<span id="totalWordCount">0</span>)</div>
      
      <div id="bulkToolbar" class="bulk-toolbar" style="display:none;">
        <label class="select-all-label">
          <input type="checkbox" id="selectAllCheckbox" class="card-checkbox" onchange="toggleSelectAll(this.checked)">
          <span id="selectedCountText">Chọn tất cả</span>
        </label>
        <div class="bulk-actions">
          <button type="button" id="btnBulkUpgrade" class="btn-bulk btn-bulk-upgrade" disabled onclick="bulkUpgradeSelected()">
            ⚡ Nâng cấp (➔ 3 lần)
          </button>
          <button type="button" id="btnBulkDelete" class="btn-bulk btn-bulk-delete" disabled onclick="bulkDeleteSelected()">
            🗑️ Xóa đã chọn
          </button>
        </div>
      </div>

      <div id="wordListContainer"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD2qytj3TPX4n5TXnGr-JJor9pqO_up4N4",
      authDomain: "german-anki-app.firebaseapp.com",
      databaseURL: "https://german-anki-app-default-rtdb.firebaseio.com",
      projectId: "german-anki-app",
      storageBucket: "german-anki-app.firebasestorage.app",
      messagingSenderId: "775151282069",
      appId: "1:775151282069:web:0eef220ca1916ec868f89c",
      measurementId: "G-BJ18Z55WFP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const cardsRef = db.ref('anki_cards');

    // === CẤU HÌNH CHUẨN ANKI ===
    const MAX_INTERVAL_DAYS = 45;
    const MIN_EASE = 1.3;
    const DEFAULT_EASE = 2.5;
    const EASY_BONUS = 1.3;

    let cards = [];
    let selectedCardIds = new Set();
    let currentCard = null;
    let isAnswerShown = false;
    let userTypedAnswer = '';
    let isSubmittingRating = false; // Cờ khóa chống bấm đúp nút đánh giá

    cardsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        cards = Object.entries(data).map(([key, card]) => ({
          ...card,
          id: String(card.id || key),
          reps: Number(card.reps || 0),
          interval: Number(card.interval || 0),
          ease: Number(card.ease || DEFAULT_EASE)
        }));
      } else {
        cards = [];
      }

      const existingIds = new Set(cards.map(c => c.id));
      selectedCardIds.forEach(id => {
        if (!existingIds.has(id)) selectedCardIds.delete(id);
      });

      document.getElementById('syncStatus').textContent = '🟢 Đã đồng bộ với Cloud (Bảo toàn tiến độ)';
      renderStudyCard();
      renderWordList();
    }, (error) => {
      document.getElementById('syncStatus').textContent = '🔴 Lỗi kết nối Cloud: ' + error.message;
    });

    function createCard(german, vietnamese, example) {
      return {
        id: String(Date.now()),
        german,
        vietnamese,
        example,
        reps: 0,
        interval: 0,
        ease: DEFAULT_EASE,
        dueTimestamp: Date.now()
      };
    }

    function saveSingleCardToCloud(card) {
      document.getElementById('syncStatus').textContent = '⏳ Đang lưu tiến độ lên Cloud...';
      const cleanCard = { ...card, id: String(card.id) };
      cardsRef.child(cleanCard.id).update(cleanCard).then(() => {
        document.getElementById('syncStatus').textContent = '🟢 Đã đồng bộ với Cloud (Bảo toàn tiến độ)';
      }).catch((err) => {
        isSubmittingRating = false;
        document.getElementById('syncStatus').textContent = '🔴 Lỗi lưu dữ liệu: ' + err.message;
      });
    }

    // === CÁC HÀM XỬ LÝ CHỌN NHIỀU THẺ ===
    function toggleSelectCard(id, isChecked) {
      const strId = String(id);
      if (isChecked) {
        selectedCardIds.add(strId);
      } else {
        selectedCardIds.delete(strId);
      }
      updateBulkToolbarUI();
      
      const itemEl = document.getElementById(`word-item-${strId}`);
      if (itemEl) {
        itemEl.classList.toggle('selected', isChecked);
      }
    }

    function toggleSelectAll(isChecked) {
      if (isChecked) {
        cards.forEach(c => selectedCardIds.add(String(c.id)));
      } else {
        selectedCardIds.clear();
      }
      renderWordList();
    }

    function updateBulkToolbarUI() {
      const count = selectedCardIds.size;
      const selectAllCb = document.getElementById('selectAllCheckbox');
      const countText = document.getElementById('selectedCountText');
      const btnUpgrade = document.getElementById('btnBulkUpgrade');
      const btnDelete = document.getElementById('btnBulkDelete');

      if (selectAllCb) {
        selectAllCb.checked = cards.length > 0 && count === cards.length;
        selectAllCb.indeterminate = count > 0 && count < cards.length;
      }
      if (countText) {
        countText.textContent = count > 0 ? `Đã chọn ${count} thẻ` : `Chọn tất cả`;
      }
      if (btnUpgrade) btnUpgrade.disabled = count === 0;
      if (btnDelete) btnDelete.disabled = count === 0;
    }

    function bulkUpgradeSelected() {
      const count = selectedCardIds.size;
      if (count === 0) return;
      if (!confirm(`Nâng cấp ${count} thẻ đang chọn lên trạng thái "Đã thuộc 3 lần" (mốc 3 ngày)?`)) return;

      document.getElementById('syncStatus').textContent = '⏳ Đang nâng cấp các thẻ đã chọn...';
      const updates = {};
      selectedCardIds.forEach(id => {
        const card = cards.find(c => c.id === id);
        if (card) {
          updates[`${id}/reps`] = 3;
          updates[`${id}/interval`] = 3;
          updates[`${id}/ease`] = card.ease || DEFAULT_EASE;
        }
      });

      cardsRef.update(updates).then(() => {
        selectedCardIds.clear();
        renderWordList();
      });
    }

    function bulkDeleteSelected() {
      const count = selectedCardIds.size;
      if (count === 0) return;
      if (!confirm(`⚠️ Bạn có chắc chắn muốn XÓA VĨNH VIỄN ${count} thẻ đang chọn khỏi bộ thẻ không?`)) return;

      document.getElementById('syncStatus').textContent = '⏳ Đang xóa các thẻ đã chọn...';
      const updates = {};
      selectedCardIds.forEach(id => {
        updates[id] = null;
      });

      cardsRef.update(updates).then(() => {
        selectedCardIds.clear();
        renderWordList();
      });
    }

    function getDueCards() {
      const now = Date.now();
      return cards.filter(card => {
        if (card.dueTimestamp) {
          return card.dueTimestamp <= now;
        } else if (card.dueDate) {
          const legacyDue = new Date(card.dueDate + 'T00:00:00').getTime();
          return legacyDue <= now;
        }
        return true;
      }).sort((a, b) => (a.dueTimestamp || 0) - (b.dueTimestamp || 0));
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('studyView').classList.add('active');
        renderStudyCard();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('addView').classList.add('active');
        renderWordList();
      }
    }

    function speakGerman(text, e) {
      if (e) e.stopPropagation();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.rate = 0.9;

        const voices = window.speechSynthesis.getVoices();
        const germanVoice = voices.find(v => v.lang.includes('de') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Microsoft')));
        if (germanVoice) {
          utterance.voice = germanVoice;
        }
        window.speechSynthesis.speak(utterance);
      }
    }

    function calculateNextReview(card, quality) {
     const MINUTE = 60 * 1000;
      const HOUR = 60 * MINUTE;
      const DAY = 24 * HOUR;

      let reps = card.reps || 0;
      let interval = card.interval || 0;
      let ease = card.ease || DEFAULT_EASE;
      let offsetMs = 10 * MINUTE;
      let label = '';

      if (quality === 0) {
        // QUÊN (Again): Reset tiến độ, giảm ease, học lại sau 10 phút
        reps = 0;
        interval = 0;
        ease = Math.max(MIN_EASE, ease - 0.2);
        offsetMs = 1 * MINUTE;
        label = '1 phút';
      } 
      else if (quality === 3) {
        // KHÓ (Hard): Giảm nhẹ ease; nếu thẻ mới thì 12 tiếng, thẻ đã học thì nhân 1.2 lần
        ease = Math.max(MIN_EASE, ease - 0.15);
        if (reps === 0 || interval < 1) {
          offsetMs = 4 * HOUR;
          label = '4 tiếng';
        } else {
          interval = Math.min(MAX_INTERVAL_DAYS, Math.max(1, Math.round(interval * 1.2)));
          offsetMs = interval * DAY;
          label = `${interval} ngày`;
        }
      } 
      else if (quality === 4) {
        // TỐT (Good): Chuẩn Anki (Lần 1: 1 ngày -> Lần 2: 3 ngày -> Lần 3+: interval * ease)
        if (reps === 0) {
          interval = 1;
        } else if (reps === 1) {
          interval = 3;
        } else {
          interval = Math.round(interval * ease);
        }
        interval = Math.min(MAX_INTERVAL_DAYS, interval);
        reps += 1;
        offsetMs = interval * DAY;
        label = `${interval} ngày`;
      } 
      else if (quality === 5) {
        // DỄ (Easy): Tăng ease, thưởng thêm hệ số EASY_BONUS (1.3)
        if (reps === 0) {
          interval = 3;
        } else if (reps === 1) {
          interval = 5;
        } else {
          interval = Math.round(interval * ease * EASY_BONUS);
        }
        interval = Math.min(MAX_INTERVAL_DAYS, interval);
        ease += 0.15;
        reps += 1;
        offsetMs = interval * DAY;
        label = `${interval} ngày`;
      }

      return { reps, interval, ease, offsetMs, label };
    }

    function updateCardSchedule(card, quality) {
      const next = calculateNextReview(card, quality);
      card.reps = next.reps;
      card.interval = next.interval;
      card.ease = Number(next.ease.toFixed(2));
      card.dueTimestamp = Date.now() + next.offsetMs;
      card.dueDate = new Date(card.dueTimestamp).toISOString().split('T')[0];
      return card;
    }

    function handleRating(quality) {
      if (!currentCard || isSubmittingRating) return;
      isSubmittingRating = true;

      document.querySelectorAll('.rate-btn').forEach(btn => btn.disabled = true);

      const cardToUpdate = { ...currentCard };
      currentCard = null;
      isAnswerShown = false;
      userTypedAnswer = '';

      const updatedCard = updateCardSchedule(cardToUpdate, quality);
      saveSingleCardToCloud(updatedCard);
    }

    function checkTypedAnswer() {
      const inputEl = document.getElementById('userAnswerInput');
      if (inputEl) {
        userTypedAnswer = inputEl.value.trim();
      }
      isAnswerShown = true;
      renderStudyCard();
      if (currentCard) {
        speakGerman(currentCard.german);
      }
    }

    function normalizeAnswer(str) {
      return String(str)
        .toLowerCase()
        .replace(/[.,!?;:]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderStudyCard() {
      isSubmittingRating = false; // Mở khóa nút khi thẻ mới render xong
      const dueCards = getDueCards();
      const statBox = document.getElementById('statBox');
      const container = document.getElementById('cardContainer');

      statBox.textContent = `Thẻ cần ôn hiện tại: ${dueCards.length} / Tổng số thẻ: ${cards.length}`;

      if (dueCards.length === 0) {
        currentCard = null;
        container.innerHTML = `
          <div class="flashcard">
            <h3>🎉 Bạn đã hoàn thành hết các thẻ đến hạn!</h3>
            <p style="color: #64748b;">Toàn bộ tiến độ học đã được lưu cố định trên Cloud (tối đa ${MAX_INTERVAL_DAYS} ngày).</p>
          </div>
        `;
        return;
      }

      currentCard = dueCards[0];
      const repsCount = currentCard.reps || 0;

      const previewAgain = calculateNextReview(currentCard, 0).label;
      const previewHard  = calculateNextReview(currentCard, 3).label;
      const previewGood  = calculateNextReview(currentCard, 4).label;
      const previewEasy  = calculateNextReview(currentCard, 5).label;

      const isExactMatch = userTypedAnswer.length > 0 && 
                           normalizeAnswer(userTypedAnswer) === normalizeAnswer(currentCard.german);

      container.innerHTML = `
        <div class="flashcard">
          <div class="card-badge">${repsCount === 0 ? 'Thẻ mới' : `Đã thuộc ${repsCount} lần`}</div>
          <div class="prompt-vi">${escapeHtml(currentCard.vietnamese)}</div>
          
          ${!isAnswerShown ? `
            <input 
              type="text" 
              id="userAnswerInput" 
              class="answer-input" 
              placeholder="Gõ từ / cụm từ tiếng Đức..." 
              autocomplete="off"
              onkeydown="if(event.key === 'Enter') { event.preventDefault(); checkTypedAnswer(); }"
            >
          ` : `
            <div class="check-result ${isExactMatch ? 'check-correct' : 'check-wrong'}">
              ${isExactMatch 
                ? `✅ Đúng chính xác! (${escapeHtml(userTypedAnswer)})` 
                : `❌ Chưa đúng! Bạn gõ: "${escapeHtml(userTypedAnswer || '(trống)')}"`
              }
            </div>

            <button type="button" class="audio-btn" onclick="speakGerman('${currentCard.german.replace(/'/g, "\\'")}', event)">🔊</button>
            <div class="german-text">${escapeHtml(currentCard.german)}</div>
            ${currentCard.example ? `<div class="example-text">"${escapeHtml(currentCard.example)}"</div>` : ''}
          `}
        </div>
        
        ${!isAnswerShown ? `
          <button type="button" class="btn-submit" onclick="checkTypedAnswer()">Kiểm tra / Hiển thị đáp án</button>
        ` : `
          <div class="rating-btns">
            <button type="button" class="rate-btn again" onclick="handleRating(0)">Quên<br><small>${previewAgain}</small></button>
            <button type="button" class="rate-btn hard" onclick="handleRating(3)">Khó<br><small>${previewHard}</small></button>
            <button type="button" class="rate-btn good" onclick="handleRating(4)">Tốt<br><small>${previewGood}</small></button>
            <button type="button" class="rate-btn easy" onclick="handleRating(5)">Dễ<br><small>${previewEasy}</small></button>
          </div>
        `}
      `;

      if (!isAnswerShown) {
        const inputEl = document.getElementById('userAnswerInput');
        if (inputEl) inputEl.focus();
      }
    }

    function formatDueStatus(card) {
      const now = Date.now();
      const due = card.dueTimestamp || now;
      if (due <= now) return 'Đến hạn ôn ngay';
      const diffHours = Math.round((due - now) / (1000 * 60 * 60));
      if (diffHours < 24) return `Ôn lại sau ~${Math.max(1, diffHours)} giờ`;
      const diffDays = Math.round(diffHours / 24);
      return `Ôn lại sau ${diffDays} ngày`;
    }

    function renderWordList() {
      const container = document.getElementById('wordListContainer');
      const toolbar = document.getElementById('bulkToolbar');
      document.getElementById('totalWordCount').textContent = cards.length;

      if (cards.length === 0) {
        toolbar.style.display = 'none';
        container.innerHTML = '<div style="text-align:center; color:#64748b; padding:15px;">Chưa có từ vựng nào trong danh sách.</div>';
        return;
      }

      toolbar.style.display = 'flex';
      const sortedCards = [...cards].reverse();

      container.innerHTML = sortedCards.map(card => {
        const safeId = escapeHtml(String(card.id));
        const isSelected = selectedCardIds.has(String(card.id));
        return `
          <div id="word-item-${safeId}" class="word-item ${isSelected ? 'selected' : ''}">
            <input 
              type="checkbox" 
              class="card-checkbox" 
              ${isSelected ? 'checked' : ''} 
              onchange="toggleSelectCard('${safeId}', this.checked)"
            >
            <div class="word-info">
              <div class="word-de">${escapeHtml(card.german)}</div>
              <div class="word-vi">${escapeHtml(card.vietnamese)}</div>
              ${card.example ? `<div class="word-ex">${escapeHtml(card.example)}</div>` : ''}
              <div class="word-meta">Chuỗi đúng: ${card.reps || 0} lần • ${formatDueStatus(card)}</div>
            </div>
            <div class="word-actions">
              <button type="button" class="btn-action btn-edit" onclick="editCard('${safeId}')">Sửa</button>
              <button type="button" class="btn-action btn-delete" onclick="deleteCard('${safeId}')">Xóa</button>
            </div>
          </div>
        `;
      }).join('');

      updateBulkToolbarUI();
    }

    document.getElementById('addCardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const german = document.getElementById('german').value.trim();
      const vietnamese = document.getElementById('vietnamese').value.trim();
      const example = document.getElementById('example').value.trim();
      const editId = document.getElementById('editCardId').value;

      if (!german || !vietnamese) return;

      if (editId) {
        const card = cards.find(c => String(c.id) === String(editId));
        if (card) {
          card.german = german;
          card.vietnamese = vietnamese;
          card.example = example;
          card.reps = Math.max(0, parseInt(document.getElementById('editReps').value) || 0);
          card.interval = Math.max(0, parseInt(document.getElementById('editInterval').value) || 0);
          saveSingleCardToCloud(card);
        }
      } else {
        const newCard = createCard(german, vietnamese, example);
        saveSingleCardToCloud(newCard);
      }

      resetForm();
    });

    function editCard(id) {
      const card = cards.find(c => String(c.id) === String(id));
      if (!card) return;

      document.getElementById('editCardId').value = String(card.id);
      document.getElementById('german').value = card.german;
      document.getElementById('vietnamese').value = card.vietnamese;
      document.getElementById('example').value = card.example || '';
      document.getElementById('editReps').value = card.reps || 0;
      document.getElementById('editInterval').value = card.interval || 0;

      document.getElementById('progressEditBox').style.display = 'grid';
      document.getElementById('formTitle').textContent = 'Chỉnh sửa từ vựng & tiến độ';
      document.getElementById('submitBtn').textContent = 'Lưu thay đổi';
      document.getElementById('cancelEditBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteCard(id) {
      if (confirm('Bạn có chắc chắn muốn xóa từ này khỏi bộ thẻ?')) {
        selectedCardIds.delete(String(id));
        cardsRef.child(String(id)).remove();
      }
    }

    function resetForm() {
      document.getElementById('editCardId').value = '';
      document.getElementById('german').value = '';
      document.getElementById('vietnamese').value = '';
      document.getElementById('example').value = '';
      document.getElementById('editReps').value = 0;
      document.getElementById('editInterval').value = 0;

      document.getElementById('progressEditBox').style.display = 'none';
      document.getElementById('formTitle').textContent = 'Thêm từ vựng mới';
      document.getElementById('submitBtn').textContent = 'Lưu vào bộ thẻ (Tự đồng bộ)';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }
  </script>
</body>
</html>
