<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki German Offline</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button.tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: #e2e8f0;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
    }
    button.tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .view { display: none; }
    .view.active { display: block; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .flashcard {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      position: relative;
    }
    .german-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    .example-text { font-style: italic; color: #64748b; margin-bottom: 15px; }
    .vietnamese-text { font-size: 18px; color: #16a34a; font-weight: 600; margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 15px; width: 100%; }
    
    .audio-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .rating-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .rate-btn {
      padding: 10px 5px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .again { background: #ef4444; }
    .hard { background: #f97316; }
    .good { background: #3b82f6; }
    .easy { background: #22c55e; }

    .stat-box {
      text-align: center;
      padding: 10px;
      background: #e0f2fe;
      border-radius: 6px;
      margin-bottom: 15px;
      font-weight: bold;
      color: #0369a1;
    }
    .data-actions {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: #64748b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('study')">Ôn tập</button>
    <button class="tab-btn" onclick="switchTab('add')">Thêm từ / Dữ liệu</button>
  </div>

  <div id="studyView" class="view active">
    <div id="statBox" class="stat-box">Đang tải...</div>
    <div id="cardContainer"></div>
  </div>

  <div id="addView" class="view">
    <form id="addCardForm">
      <div class="form-group">
        <label for="german">Từ vựng / Cụm từ tiếng Đức:</label>
        <input type="text" id="german" placeholder="vd: die Sprachprüfung" required>
      </div>
      <div class="form-group">
        <label for="vietnamese">Nghĩa tiếng Việt:</label>
        <input type="text" id="vietnamese" placeholder="vd: kỳ thi năng lực ngôn ngữ" required>
      </div>
      <div class="form-group">
        <label for="example">Ví dụ (nếu có):</label>
        <textarea id="example" rows="2" placeholder="vd: Ich bereite mich auf die Sprachprüfung vor."></textarea>
      </div>
      <button type="submit" class="btn-submit">Lưu vào bộ thẻ</button>
    </form>

    <div class="data-actions">
      <button class="btn-secondary" onclick="exportData()">Sao lưu dữ liệu (Export JSON)</button>
      <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Nhập dữ liệu (Import JSON)</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'anki_german_cards_v1';

    function createCard(german, vietnamese, example) {
      return {
        id: Date.now(),
        german,
        vietnamese,
        example,
        interval: 0,
        repetition: 0,
        efactor: 2.5,
        dueDate: new Date().toISOString().split('T')[0]
      };
    }

    function loadCards() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveCards(cards) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }

    let cards = loadCards();
    let currentCard = null;
    let isAnswerShown = false;

    function getDueCards() {
      const today = new Date().toISOString().split('T')[0];
      return cards.filter(card => card.dueDate <= today);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('studyView').classList.add('active');
        renderStudyCard();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('addView').classList.add('active');
      }
    }

    function speakGerman(text, e) {
      if (e) e.stopPropagation();
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        window.speechSynthesis.speak(utterance);
      }
    }

    function updateCardSM2(card, quality) {
      if (quality < 3) {
        card.repetition = 0;
        card.interval = 1;
      } else {
        if (card.repetition === 0) card.interval = 1;
        else if (card.repetition === 1) card.interval = 6;
        else card.interval = Math.round(card.interval * card.efactor);
        card.repetition += 1;
      }
      card.efactor = card.efactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
      if (card.efactor < 1.3) card.efactor = 1.3;

      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + card.interval);
      card.dueDate = nextDate.toISOString().split('T')[0];

      return card;
    }

    function handleRating(quality) {
      if (!currentCard) return;
      const updatedCard = updateCardSM2(currentCard, quality);
      const index = cards.findIndex(c => c.id === currentCard.id);
      cards[index] = updatedCard;
      saveCards(cards);
      isAnswerShown = false;
      renderStudyCard();
    }

    function renderStudyCard() {
      const dueCards = getDueCards();
      const statBox = document.getElementById('statBox');
      const container = document.getElementById('cardContainer');

      statBox.textContent = `Thẻ cần ôn hôm nay: ${dueCards.length} / Tổng số thẻ: ${cards.length}`;

      if (dueCards.length === 0) {
        container.innerHTML = `
          <div class="flashcard">
            <h3>🎉 Bạn đã hoàn thành hết các thẻ hôm nay!</h3>
            <p style="color: #64748b;">Hãy quay lại vào ngày mai để tiếp tục chu kỳ ngắt quãng.</p>
          </div>
        `;
        return;
      }

      currentCard = dueCards[0];

      container.innerHTML = `
        <div class="flashcard" onclick="toggleAnswer()">
          <button class="audio-btn" onclick="speakGerman('${currentCard.german.replace(/'/g, "\\'")}', event)">🔊</button>
          <div class="german-text">${currentCard.german}</div>
          ${currentCard.example ? `<div class="example-text">"${currentCard.example}"</div>` : ''}
          ${isAnswerShown ? `<div class="vietnamese-text">${currentCard.vietnamese}</div>` : ''}
        </div>
        
        ${!isAnswerShown ? `
          <button class="btn-submit" onclick="toggleAnswer()">Hiển thị đáp án</button>
        ` : `
          <div class="rating-btns">
            <button class="rate-btn again" onclick="handleRating(0)">Quên<br><small>1 ngày</small></button>
            <button class="rate-btn hard" onclick="handleRating(3)">Khó<br><small>Tăng nhẹ</small></button>
            <button class="rate-btn good" onclick="handleRating(4)">Tốt<br><small>Tối ưu</small></button>
            <button class="rate-btn easy" onclick="handleRating(5)">Dễ<br><small>Giãn xa</small></button>
          </div>
        `}
      `;
    }

    function toggleAnswer() {
      isAnswerShown = true;
      renderStudyCard();
    }

    document.getElementById('addCardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const german = document.getElementById('german').value.trim();
      const vietnamese = document.getElementById('vietnamese').value.trim();
      const example = document.getElementById('example').value.trim();

      if (!german || !vietnamese) return;

      cards.push(createCard(german, vietnamese, example));
      saveCards(cards);

      document.getElementById('german').value = '';
      document.getElementById('vietnamese').value = '';
      document.getElementById('example').value = '';
      alert('Đã thêm thẻ mới thành công!');
    });

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `anki_german_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const importedCards = JSON.parse(e.target.result);
          if (Array.isArray(importedCards)) {
            cards = importedCards;
            saveCards(cards);
            alert('Đã nhập dữ liệu từ vựng thành công!');
            switchTab('study');
          }
        } catch (err) {
          alert('File dữ liệu không hợp lệ!');
        }
      };
      fileReader.readAsText(event.target.files[0]);
    }

    renderStudyCard();
  </script>
</body>
</html>
