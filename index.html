<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki German Cloud Sync</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #d97706;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    button.tab-btn {
      flex: 1; padding: 12px; border: 1px solid var(--border);
      background: #e2e8f0; cursor: pointer; border-radius: 8px; font-weight: bold;
      font-size: 15px;
    }
    button.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .view { display: none; }
    .view.active { display: block; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 6px; box-sizing: border-box; font-size: 14px;
    }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary);
      color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;
    }
    .btn-cancel {
      width: 100%; padding: 8px; background: #94a3b8;
      color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 8px;
    }

    .flashcard {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 30px 20px; text-align: center;
      min-height: 180px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .german-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #1e293b; }
    .example-text { font-style: italic; color: #64748b; margin-bottom: 15px; }
    .vietnamese-text {
      font-size: 18px; color: #16a34a; font-weight: 600;
      margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 15px; width: 100%;
    }
    
    .audio-btn {
      background: #f1f5f9; border: 1px solid var(--border);
      border-radius: 50%; width: 44px; height: 44px; cursor: pointer; margin-bottom: 12px; font-size: 20px;
    }

    .rating-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rate-btn { padding: 10px 5px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    .again { background: #ef4444; }
    .hard { background: #f97316; }
    .good { background: #3b82f6; }
    .easy { background: #22c55e; }

    .stat-box {
      text-align: center; padding: 10px; background: #e0f2fe;
      border-radius: 6px; margin-bottom: 15px; font-weight: bold; color: #0369a1;
    }
    .sync-status {
      font-size: 13px; text-align: center; margin-bottom: 12px; font-weight: 600; color: #475569;
    }

    /* Bảng danh sách Quản lý từ vựng */
    .word-list-section {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 2px solid var(--primary);
    }
    .word-list-title {
      font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--primary);
    }
    .word-item {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .word-info { flex: 1; padding-right: 10px; }
    .word-de { font-weight: bold; color: var(--text); font-size: 16px; }
    .word-vi { color: #16a34a; font-size: 14px; font-weight: 500; }
    .word-ex { font-style: italic; color: #64748b; font-size: 12px; }
    .word-actions { display: flex; gap: 6px; }
    .btn-action {
      padding: 6px 12px; border: none; border-radius: 6px;
      color: white; font-size: 13px; cursor: pointer; font-weight: bold;
    }
    .btn-edit { background: var(--warning); }
    .btn-delete { background: var(--danger); }
  </style>

  <!-- Firebase App & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('study')">Ôn tập</button>
    <button class="tab-btn" onclick="switchTab('add')">Thêm / Quản lý từ</button>
  </div>

  <div class="sync-status" id="syncStatus">🔄 Đang kết nối Cloud...</div>

  <div id="studyView" class="view active">
    <div id="statBox" class="stat-box">Đang tải dữ liệu...</div>
    <div id="cardContainer"></div>
  </div>

  <div id="addView" class="view">
    <form id="addCardForm">
      <h3 id="formTitle" style="margin-top:0;">Thêm từ vựng mới</h3>
      <input type="hidden" id="editCardId" value="">
      
      <div class="form-group">
        <label for="german">Từ vựng / Cụm từ tiếng Đức:</label>
        <input type="text" id="german" placeholder="vd: die Sprachprüfung" required>
      </div>
      <div class="form-group">
        <label for="vietnamese">Nghĩa tiếng Việt:</label>
        <input type="text" id="vietnamese" placeholder="vd: kỳ thi năng lực ngôn ngữ" required>
      </div>
      <div class="form-group">
        <label for="example">Ví dụ (nếu có):</label>
        <textarea id="example" rows="2" placeholder="vd: Ich bereite mich auf die Sprachprüfung vor."></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">Lưu vào bộ thẻ (Tự đồng bộ)</button>
      <button type="button" id="cancelEditBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Hủy sửa</button>
    </form>

    <div class="word-list-section">
      <div class="word-list-title">📋 Danh sách từ đã lưu (<span id="totalWordCount">0</span>)</div>
      <div id="wordListContainer"></div>
    </div>
  </div>

  <script>
    // Cấu hình Firebase của bạn
    const firebaseConfig = {
      apiKey: "AIzaSyD2qytj3TPX4n5TXnGr-JJor9pqO_up4N4",
      authDomain: "german-anki-app.firebaseapp.com",
      databaseURL: "https://german-anki-app-default-rtdb.firebaseio.com",
      projectId: "german-anki-app",
      storageBucket: "german-anki-app.firebasestorage.app",
      messagingSenderId: "775151282069",
      appId: "1:775151282069:web:0eef220ca1916ec868f89c",
      measurementId: "G-BJ18Z55WFP"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const cardsRef = db.ref('anki_cards');

    let cards = [];
    let currentCard = null;
    let isAnswerShown = false;

    // Lắng nghe thay đổi dữ liệu thời gian thực từ Cloud
    cardsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      cards = data ? Object.values(data) : [];
      document.getElementById('syncStatus').textContent = '🟢 Đã đồng bộ với Cloud (Laptop 📲 Phone)';
      renderStudyCard();
      renderWordList();
    });

    function createCard(german, vietnamese, example) {
      return {
        id: Date.now(),
        german,
        vietnamese,
        example,
        interval: 0,
        repetition: 0,
        efactor: 2.5,
        dueDate: new Date().toISOString().split('T')[0]
      };
    }

    function saveCardsToCloud() {
      document.getElementById('syncStatus').textContent = '⏳ Đang lưu dữ liệu lên Cloud...';
      const cardsObj = {};
      cards.forEach(card => cardsObj[card.id] = card);
      cardsRef.set(cardsObj);
    }

    function getDueCards() {
      const today = new Date().toISOString().split('T')[0];
      return cards.filter(card => card.dueDate <= today);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('studyView').classList.add('active');
        renderStudyCard();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('addView').classList.add('active');
        renderWordList();
      }
    }

    function speakGerman(text, e) {
      if (e) e.stopPropagation();
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Thuật toán ôn tập ngắt quãng SM-2 (Chuẩn Anki)
    function updateCardSM2(card, quality) {
      if (quality < 3) {
        card.repetition = 0;
        card.interval = 1;
      } else {
        if (card.repetition === 0) card.interval = 1;
        else if (card.repetition === 1) card.interval = 6;
        else card.interval = Math.round(card.interval * card.efactor);
        card.repetition += 1;
      }
      card.efactor = card.efactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
      if (card.efactor < 1.3) card.efactor = 1.3;

      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + card.interval);
      card.dueDate = nextDate.toISOString().split('T')[0];

      return card;
    }

    function handleRating(quality) {
      if (!currentCard) return;
      const updatedCard = updateCardSM2(currentCard, quality);
      const index = cards.findIndex(c => c.id === currentCard.id);
      cards[index] = updatedCard;

      saveCardsToCloud();
      isAnswerShown = false;
      renderStudyCard();
    }

    function renderStudyCard() {
      const dueCards = getDueCards();
      const statBox = document.getElementById('statBox');
      const container = document.getElementById('cardContainer');

      statBox.textContent = `Thẻ cần ôn hôm nay: ${dueCards.length} / Tổng số thẻ: ${cards.length}`;

      if (dueCards.length === 0) {
        container.innerHTML = `
          <div class="flashcard">
            <h3>🎉 Bạn đã hoàn thành hết các thẻ hôm nay!</h3>
            <p style="color: #64748b;">Hãy quay lại vào ngày mai để tiếp tục chu kỳ ngắt quãng.</p>
          </div>
        `;
        return;
      }

      currentCard = dueCards[0];

      container.innerHTML = `
        <div class="flashcard" onclick="toggleAnswer()">
          <button class="audio-btn" onclick="speakGerman('${currentCard.german.replace(/'/g, "\\'")}', event)">🔊</button>
          <div class="german-text">${currentCard.german}</div>
          ${currentCard.example ? `<div class="example-text">"${currentCard.example}"</div>` : ''}
          ${isAnswerShown ? `<div class="vietnamese-text">${currentCard.vietnamese}</div>` : ''}
        </div>
        
        ${!isAnswerShown ? `
          <button class="btn-submit" onclick="toggleAnswer()">Hiển thị đáp án</button>
        ` : `
          <div class="rating-btns">
            <button class="rate-btn again" onclick="handleRating(0)">Quên<br><small>1 ngày</small></button>
            <button class="rate-btn hard" onclick="handleRating(3)">Khó<br><small>Tăng nhẹ</small></button>
            <button class="rate-btn good" onclick="handleRating(4)">Tốt<br><small>Tối ưu</small></button>
            <button class="rate-btn easy" onclick="handleRating(5)">Dễ<br><small>Giãn xa</small></button>
          </div>
        `}
      `;
    }

    function toggleAnswer() {
      isAnswerShown = true;
      renderStudyCard();
    }

    function renderWordList() {
      const container = document.getElementById('wordListContainer');
      document.getElementById('totalWordCount').textContent = cards.length;

      if (cards.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; padding:15px;">Chưa có từ vựng nào trong danh sách.</div>';
        return;
      }

      const sortedCards = [...cards].reverse();

      container.innerHTML = sortedCards.map(card => `
        <div class="word-item">
          <div class="word-info">
            <div class="word-de">${card.german}</div>
            <div class="word-vi">${card.vietnamese}</div>
            ${card.example ? `<div class="word-ex">${card.example}</div>` : ''}
          </div>
          <div class="word-actions">
            <button class="btn-action btn-edit" onclick="editCard(${card.id})">Sửa</button>
            <button class="btn-action btn-delete" onclick="deleteCard(${card.id})">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('addCardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const german = document.getElementById('german').value.trim();
      const vietnamese = document.getElementById('vietnamese').value.trim();
      const example = document.getElementById('example').value.trim();
      const editId = document.getElementById('editCardId').value;

      if (!german || !vietnamese) return;

      if (editId) {
        const index = cards.findIndex(c => c.id == editId);
        if (index !== -1) {
          cards[index].german = german;
          cards[index].vietnamese = vietnamese;
          cards[index].example = example;
        }
      } else {
        cards.push(createCard(german, vietnamese, example));
      }

      saveCardsToCloud();
      resetForm();
    });

    function editCard(id) {
      const card = cards.find(c => c.id == id);
      if (!card) return;

      document.getElementById('editCardId').value = card.id;
      document.getElementById('german').value = card.german;
      document.getElementById('vietnamese').value = card.vietnamese;
      document.getElementById('example').value = card.example || '';

      document.getElementById('formTitle').textContent = 'Chỉnh sửa từ vựng';
      document.getElementById('submitBtn').textContent = 'Lưu thay đổi';
      document.getElementById('cancelEditBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteCard(id) {
      if (confirm('Bạn có chắc chắn muốn xóa từ này khỏi bộ thẻ?')) {
        cards = cards.filter(c => c.id != id);
        saveCardsToCloud();
      }
    }

    function resetForm() {
      document.getElementById('editCardId').value = '';
      document.getElementById('german').value = '';
      document.getElementById('vietnamese').value = '';
      document.getElementById('example').value = '';

      document.getElementById('formTitle').textContent = 'Thêm từ vựng mới';
      document.getElementById('submitBtn').textContent = 'Lưu vào bộ thẻ (Tự đồng bộ)';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }
  </script>
</body>
</html>
